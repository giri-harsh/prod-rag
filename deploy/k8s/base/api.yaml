apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  labels: {app: rag-api}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app: rag-api}
  template:
    metadata:
      labels: {app: rag-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"      # metrics live on the internal port, NOT the Service port
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: rag-api}}
      containers:
        - name: api
          image: prod-rag
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9100}
          envFrom:
            - configMapRef: {name: rag-config}
            - secretRef: {name: rag-secrets}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 5, failureThreshold: 3}
          resources:
            requests: {cpu: "2", memory: 3Gi}
            limits: {cpu: "4", memory: 4Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
spec:
  selector: {app: rag-api}
  ports: [{name: http, port: 80, targetPort: http}]   # 9100 is intentionally not exposed
