apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: rag-api}
  minReplicas: 3
  maxReplicas: 60
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
    - type: Pods                    # custom metric: needs prometheus-adapter exposing http_requests_per_second
      pods:
        metric: {name: http_requests_per_second}
        target: {type: AverageValue, averageValue: "35"}   # per-pod RPS target (~80% of the derated ~44 RPS/pod, real reranker; see DOCS/12); see DOCS/12_CAPACITY.md
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Percent, value: 100, periodSeconds: 30}]}
    scaleDown: {stabilizationWindowSeconds: 300, policies: [{type: Pods, value: 2, periodSeconds: 60}]}
