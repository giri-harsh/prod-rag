name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (locked)
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv -r requirements-dev.lock
      - name: Lint (ruff)
        run: .venv/bin/ruff check app tests
      - name: Import smoke test
        run: .venv/bin/pytest tests/test_imports.py -q
      - name: Unit + integration tests (embedded Postgres, fake Redis/Qdrant/LLMs)
        run: .venv/bin/pytest tests -q
