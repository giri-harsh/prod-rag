[project]
name = "prod-rag"
version = "0.2.0"
description = "Multi-tenant production RAG API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "gunicorn",
  "pydantic>=2",
  "pydantic-settings",
  "python-dotenv",
  "logfire[fastapi]",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]",
  "langchain",
  "langchain-core",
  "langchain-openai",
  "langchain-groq",
  "langchain-google-genai",
  "qdrant-client",
  "flashrank",
  "portkey-ai",
  "nemoguardrails",
  "redis>=5,<6",  # arq 0.25 is only exercised against redis-py 5.x
  "tenacity",
  "arq",
  "prometheus-fastapi-instrumentator",
  "langsmith",
  "fastembed",
  "pypdf",
  "pdfplumber",
  "beautifulsoup4",
  "python-docx",
  "python-pptx",
]

[project.optional-dependencies]
ui = ["streamlit", "requests"]
# ragas is pinned: 0.4.3 is the version DOCS/10 documents the API rules for, and evals/metrics.py carries a shim
# for its langchain-community import. sentence-transformers is what HuggingFaceEmbeddings(use_api=False) needs.
eval = ["ragas==0.4.3", "pandas", "openai", "sentence-transformers"]

[dependency-groups]
# psutil is a direct import of scripts/chaos_drill.py (it targets the pid LISTENING on a port, never an image
# name), so it is declared here rather than relied on as a transitive pin in requirements-dev.lock.
dev = ["pip-audit", "bandit", "pytest", "pytest-asyncio", "fakeredis", "httpx", "ruff", "asgi-lifespan", "pgserver", "psutil"]

load = ["locust"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs real postgres/redis/qdrant (docker compose)", "live: needs real Groq/Portkey/Gemini keys"]
addopts = "--ignore=tests/live"

[tool.ruff]
line-length = 110
extend-exclude = ["notebooks", "DATA", "evals", "ui"]
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
