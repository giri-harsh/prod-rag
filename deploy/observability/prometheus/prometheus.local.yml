# Prometheus config with STATIC targets: docker compose (service names api / worker) or a single host.
# Validate:  promtool check config deploy/observability/prometheus/prometheus.local.yml
# Edit the targets to match where METRICS_PORT (API, default 9100) and WORKER_METRICS_PORT (worker, default 9101) are reachable.
# docker-compose.yml publishes neither port to the host: run Prometheus on the compose network, or add `ports` for them.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9100"]

  - job_name: rag-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
