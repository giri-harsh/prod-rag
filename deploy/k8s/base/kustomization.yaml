apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rag
resources:
  - namespace.yaml
  - configmap.yaml
  - pgbouncer.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - hpa.yaml
  - pdb.yaml
images:
  - name: prod-rag
    newName: ghcr.io/example/prod-rag   # override with `kustomize edit set image` in your overlay/CI
    newTag: latest
# Secrets are NOT in the base. Create rag-secrets out of band (see secret.example.yaml).
