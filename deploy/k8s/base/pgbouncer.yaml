apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels: {app: pgbouncer}
spec:
  replicas: 2
  selector:
    matchLabels: {app: pgbouncer}
  template:
    metadata:
      labels: {app: pgbouncer}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 70, seccompProfile: {type: RuntimeDefault}}
      # Without this, both replicas can land on one node and the PDB's minAvailable:1 protects nothing against
      # a node failure - every app pod talks to this Service. "preferred" rather than "required" so a
      # single-node dev cluster still schedules both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: pgbouncer}
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1-p3
          ports: [{name: pg, containerPort: 5432}]
          env:
            - {name: POOL_MODE, value: transaction}   # psycopg uses prepare_threshold=0, safe in transaction mode
            - {name: MAX_CLIENT_CONN, value: "2000"}
            - {name: DEFAULT_POOL_SIZE, value: "25"}
            - {name: AUTH_TYPE, value: scram-sha-256}
            - {name: DB_NAME, value: rag}
            - name: DB_HOST
              valueFrom: {secretKeyRef: {name: rag-secrets, key: PGBOUNCER_DB_HOST}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: rag-secrets, key: PGBOUNCER_DB_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: rag-secrets, key: PGBOUNCER_DB_PASSWORD}}
          readinessProbe: {tcpSocket: {port: 5432}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 5432}, periodSeconds: 10, initialDelaySeconds: 10}
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  selector: {app: pgbouncer}
  ports: [{name: pg, port: 5432, targetPort: pg}]
