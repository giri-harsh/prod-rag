x-app-env: &app-env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgresql://rag:rag@pgbouncer:5432/rag          # app traffic goes through pgbouncer (transaction pooling)
  DIRECT_DATABASE_URL: postgresql://rag:rag@postgres:5432/rag    # migrations need a session-mode connection
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
  METRICS_PORT: 9100
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  PORTKEY_API_KEY: ${PORTKEY_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
  INGEST_ROOT: /data
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}

x-app-build: &app-build
  build: .
  image: prod-rag:local

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    environment:
      DB_HOST: postgres
      DB_USER: rag
      DB_PASSWORD: rag
      DB_NAME: rag
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "25"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:           # one-shot: SQL migrations + LangGraph checkpoint tables
    <<: *app-build
    command: ["python", "-m", "app.db.migrate"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app-build
    environment: *app-env
    ports: ["8080:8080"]
    volumes: ["./DATA:/data:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    # runs as the unprivileged `app` user (uid 10001) defined in the Dockerfile

  worker:
    <<: *app-build
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *app-env
    volumes: ["./DATA:/data:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}

volumes:
  pgdata:
  qdrantdata:
