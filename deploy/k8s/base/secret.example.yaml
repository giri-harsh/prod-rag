# NOT part of the kustomization. Create the real secret with your secret manager or kubectl create secret.
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag
type: Opaque
stringData:
  DATABASE_URL: postgresql://rag:CHANGE_ME@pgbouncer:5432/rag                 # via pgbouncer (transaction pooling)
  DIRECT_DATABASE_URL: postgresql://rag:CHANGE_ME@postgres.example:5432/rag   # migrations (session mode)
  REDIS_URL: redis://redis.example:6379/0
  QDRANT_URL: https://CLUSTER.cloud.qdrant.io:6333
  QDRANT_API_KEY: CHANGE_ME
  GROQ_API_KEY: CHANGE_ME
  PORTKEY_API_KEY: CHANGE_ME
  GEMINI_API_KEY: CHANGE_ME
  LOGFIRE_TOKEN: ""
  PGBOUNCER_DB_HOST: postgres.example
  PGBOUNCER_DB_USER: rag
  PGBOUNCER_DB_PASSWORD: CHANGE_ME
