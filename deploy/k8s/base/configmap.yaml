apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
data:
  APP_ENV: "prod"
  QDRANT_COLLECTION: "enterprise_rag"
  EMBEDDING_MODEL: "gemini-embedding-2"
  EMBEDDING_DIM: "768"
  LLM_TIMEOUT_S: "30"
  EMBED_TIMEOUT_S: "10"
  QDRANT_TIMEOUT_S: "5"
  LLM_CONCURRENCY: "32"
  WEB_CONCURRENCY: "4"          # keep equal to gunicorn workers: sizes the in-process limiter fallback
  INGEST_ROOT: "/data"
  METRICS_PORT: "9100"
